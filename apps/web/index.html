<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoryCraft</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='28' font-size='28'%3E🏰%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 大厅画面 -->
  <div id="lobby-screen" class="overlay">
    <div class="lobby-container">
      <div class="lobby-top-bar">
        <span id="user-badge-lobby" class="badge-text">游客</span>
        <button id="user-btn-lobby" class="lang-btn-sm" title="登录">👤</button>
        <button id="lang-toggle-lobby" class="lang-btn-sm" title="Switch language">EN</button>
        <button id="settings-btn-lobby" class="lang-btn-sm" title="AI 设置">⚙️</button>
      </div>
      <h1 class="lobby-title">StoryCraft</h1>
      <p class="lobby-subtitle">探索不同的世界，揭开隐藏的真相</p>
      <div id="lobby-grid" class="lobby-grid">
        <!-- World cards rendered by JS -->
      </div>
    </div>
  </div>

  <!-- 结局画面 -->
  <div id="end-screen" class="overlay hidden">
    <div class="overlay-content">
      <h1 id="ending-title"></h1>
      <p id="ending-summary"></p>
      <div id="ending-consequences"></div>
      <div class="btn-row">
        <button id="restart-btn" class="btn-primary">再来一次</button>
        <button id="back-to-lobby-btn" class="btn-primary btn-secondary">返回大厅</button>
      </div>
    </div>
  </div>

  <!-- 游戏界面 -->
  <div id="game" class="hidden">
    <header id="status-bar">
      <span id="turns-display">剩余回合：8</span>
      <span id="room-display">大厅</span>
      <span style="flex:1"></span>
      <span id="user-badge-game" style="display:none"></span>
      <button id="user-btn-game" class="lang-btn-sm" title="用户">👤</button>
      <button id="lang-toggle-game" class="lang-btn-sm" title="语言">EN</button>
      <button id="settings-btn-game" class="lang-btn-sm" title="设置">⚙️</button>
      <span id="config-badge" style="display:none"></span>
    </header>

    <div id="main-layout">
      <div id="left-panel">
        <section id="scene-panel">
          <h2 id="room-name"></h2>
          <p id="room-description"></p>
          <div id="room-art"></div>
          <div id="room-exits"></div>
          <div id="room-npcs"></div>
        </section>

        <section id="narrative-panel">
          <div id="narrative-log"></div>
        </section>

        <section id="npc-panel-inline" class="hidden">
          <div id="npc-list-inline"></div>
        </section>

        <div id="command-bar">
          <select id="npc-select" class="npc-select hidden" autocomplete="off"></select>
          <input type="text" id="command-input" placeholder="说点什么…" autocomplete="off" />
          <button id="command-submit">→</button>
        </div>
      </div>

      <aside id="right-panel">
        <!-- 地图 (dynamic) -->
        <section id="map-section">
          <h3 id="map-heading">地图</h3>
          <div id="map-body">
            <!-- SVG map generated dynamically by map-renderer.ts -->
          </div>
        </section>

        <!-- NPC -->
        <section id="npc-section">
          <h3 id="npc-heading">在场人物</h3>
          <div id="npc-list"></div>
        </section>

        <!-- 场景物品 -->
        <section id="scene-items-section">
          <h3 id="scene-heading">场景</h3>
          <div id="scene-items-list"></div>
        </section>

        <!-- 物品栏 -->
        <section id="inventory-section">
          <h3 id="inventory-heading">物品栏</h3>
          <ul id="inventory-list"></ul>
        </section>

        <!-- 线索 -->
        <section id="clues-section">
          <h3 id="clues-heading">线索</h3>
          <ul id="clues-list"></ul>
        </section>

        <!-- 信任度 -->
        <section id="trust-section">
          <h3 id="trust-heading">信任度</h3>
          <div id="trust-list"></div>
        </section>

        <!-- 后果 -->
        <section id="consequences-section">
          <h3 id="consequences-heading">后果</h3>
          <ul id="consequences-list"></ul>
        </section>
      </aside>
    </div>
  </div>

  <!-- 移动端右侧栏拉出标签 -->
  <button id="sidebar-tab" title="打开面板">◀</button>

  <!-- 移动端侧栏遮罩 -->
  <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

  <!-- AI 设置弹窗 (no auth — that's separate) -->
  <div id="settings-modal" class="overlay hidden">
    <div class="modal-card" style="width:420px">
      <button id="settings-close" class="lang-btn" title="关闭">✕</button>
      <h2 class="modal-title" id="settings-title">AI 叙事设置</h2>

      <!-- Mode toggle -->
      <div class="toggle-row">
        <button id="settings-mode-normal" class="toggle-btn">普通模式</button>
        <button id="settings-mode-smart" class="toggle-btn">智能模式</button>
      </div>
      <p id="settings-mode-desc" class="modal-desc"></p>

      <!-- Smart mode config (hidden in normal mode) -->
      <div id="settings-smart-config">
        <!-- Config source toggle -->
        <div class="toggle-row">
          <button id="settings-src-env" class="toggle-btn toggle-btn-sm">用房主的</button>
          <button id="settings-src-custom" class="toggle-btn toggle-btn-sm">用自己的</button>
        </div>
        <!-- Env/host key info (model name + test button) -->
        <div id="settings-env-info" class="modal-env-info">
          <div class="modal-env-row">
            <span id="settings-env-model"></span>
            <button id="settings-test-btn" class="modal-test-btn">敲门试试</button>
          </div>
        </div>
        <!-- Custom config fields (hidden when env is selected) -->
        <div id="settings-custom-fields">
          <label class="modal-label">
            API Key
            <input type="password" id="settings-api-key" class="modal-input" placeholder="sk-..." />
          </label>
          <label class="modal-label">
            Base URL
            <input type="text" id="settings-base-url" class="modal-input" placeholder="https://api.deepseek.com" />
          </label>
          <label class="modal-label">
            Model
            <input type="text" id="settings-model" class="modal-input" placeholder="deepseek-v4-pro" />
          </label>
        </div>
      </div>

      <button id="settings-save" class="btn-primary modal-save-btn">保存</button>
      <p id="settings-status" class="modal-status"></p>
    </div>
  </div>

  <!-- 登录弹窗 (独立于设置) -->
  <div id="auth-modal" class="overlay hidden">
    <div class="modal-card" style="width:320px">
      <button id="auth-close" class="lang-btn" title="关闭">✕</button>
      <!-- Guest state -->
      <div id="auth-guest">
        <h2 class="modal-title" id="auth-title">登录</h2>
        <label class="modal-label">
          用户名
          <input type="text" id="auth-username" class="modal-input" placeholder="username" />
        </label>
        <label class="modal-label">
          密码
          <input type="password" id="auth-password" class="modal-input" placeholder="password" />
        </label>
        <div class="toggle-row" style="gap:0.4rem">
          <button id="auth-login-btn" class="toggle-btn toggle-btn-active">登录</button>
          <button id="auth-register-btn" class="toggle-btn">注册</button>
        </div>
        <p id="auth-status" class="modal-status"></p>
      </div>
      <!-- Logged-in state -->
      <div id="auth-user" style="display:none">
        <h2 class="modal-title">👤 <span id="auth-username-display"></span></h2>
        <p class="modal-desc" id="auth-role-desc"></p>
        <button id="auth-logout-btn" class="toggle-btn" style="display:block;width:100%">登出</button>
      </div>
    </div>
  </div>

  <!-- Toast notification (bottom-left) -->
  <div id="toast" class="toast-container"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
